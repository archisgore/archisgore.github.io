<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  {% if page.description %}<meta name="description" content="{{ page.description | strip_html | strip_newlines | truncate: 200 }}">
  {% elsif site.description %}<meta name="description" content="{{ site.description | strip_newlines }}">{% endif %}
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23111%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27sans-serif%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EA%3C/text%3E%3C/svg%3E">
  {% seo title=false %}
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-title">{{ site.title }}</a>
    <nav>
      <a href="/assets/resume/Archis_Gore_Resume_May2026_v5.pdf">Résumé</a>
      <a href="https://archisgore.substack.com">Substack</a>
      <a href="https://medium.com/@archisgore">Medium</a>
      <a href="https://github.com/archisgore">GitHub</a>
      <a href="https://www.linkedin.com/in/archisgore/">LinkedIn</a>
    </nav>
  </div>
</header>

<main>
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    <p>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      &nbsp;·&nbsp;
      <a href="https://github.com/archisgore/archisgore.github.io">source</a>
    </p>
    <p class="copyright">© {{ "now" | date: "%Y" }} {{ site.author.name }}.</p>
  </div>
</footer>

</body>
</html>
